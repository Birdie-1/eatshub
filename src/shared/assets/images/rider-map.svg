<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- Stylized city map drawn for the eatsHub mockup (R2 background). No real map data. -->
  <rect width="400" height="800" fill="#eceff3"/>
  <!-- blocks -->
  <g fill="#e2e6ec">
    <rect x="18" y="20" width="96" height="120" rx="6"/>
    <rect x="150" y="20" width="110" height="70" rx="6"/>
    <rect x="290" y="20" width="96" height="140" rx="6"/>
    <rect x="18" y="180" width="96" height="90" rx="6"/>
    <rect x="290" y="200" width="96" height="100" rx="6"/>
    <rect x="18" y="430" width="96" height="120" rx="6"/>
    <rect x="150" y="470" width="110" height="80" rx="6"/>
    <rect x="290" y="440" width="96" height="70" rx="6"/>
    <rect x="18" y="600" width="96" height="80" rx="6"/>
    <rect x="290" y="560" width="96" height="120" rx="6"/>
    <rect x="18" y="720" width="96" height="70" rx="6"/>
    <rect x="290" y="720" width="96" height="70" rx="6"/>
  </g>
  <!-- park -->
  <rect x="150" y="120" width="110" height="150" rx="10" fill="#cfe8c6"/>
  <circle cx="180" cy="160" r="10" fill="#b5dbab"/>
  <circle cx="226" cy="214" r="14" fill="#b5dbab"/>
  <circle cx="196" cy="240" r="8" fill="#b5dbab"/>
  <rect x="150" y="600" width="110" height="80" rx="10" fill="#cfe8c6"/>
  <!-- river -->
  <path d="M-20 330 C 80 300, 140 380, 220 360 S 340 300, 420 340" fill="none" stroke="#b8dcf3" stroke-width="44"/>
  <!-- road casings -->
  <g fill="none" stroke="#d7dce3" stroke-linecap="round">
    <path d="M132 -10 V 810" stroke-width="20"/>
    <path d="M274 -10 V 810" stroke-width="20"/>
    <path d="M-10 160 H 410" stroke-width="14"/>
    <path d="M-10 410 H 410" stroke-width="20"/>
    <path d="M-10 580 H 410" stroke-width="14"/>
    <path d="M-10 700 H 410" stroke-width="14"/>
    <path d="M-10 790 L 410 470" stroke-width="16"/>
  </g>
  <!-- roads -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M132 -10 V 810" stroke-width="15"/>
    <path d="M274 -10 V 810" stroke-width="15"/>
    <path d="M-10 160 H 410" stroke-width="9"/>
    <path d="M-10 410 H 410" stroke-width="15"/>
    <path d="M-10 580 H 410" stroke-width="9"/>
    <path d="M-10 700 H 410" stroke-width="9"/>
    <path d="M-10 790 L 410 470" stroke-width="11"/>
    <path d="M66 140 V 180 M 66 270 V 430 M 338 300 V 440 M 205 90 V 120 M 205 550 V 600" stroke-width="5"/>
  </g>
  <!-- bridges -->
  <g fill="#ffffff" stroke="#d7dce3" stroke-width="2">
    <rect x="122" y="322" width="20" height="56"/>
    <rect x="264" y="300" width="20" height="56"/>
  </g>
  <!-- main road center lines -->
  <g fill="none" stroke="#fde9b0" stroke-width="2" stroke-dasharray="10 10">
    <path d="M-10 410 H 410"/>
    <path d="M132 -10 V 810"/>
  </g>
</svg>
